name: Lint and Format Check

on:
  pull_request:
    branches:
      - '*'

jobs:
  lint-and-format:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # Python Formatting and Linting
      - name: Install Python dependencies
        run: |
          pip install black
      - name: Run Black
        run: black --check . --exclude "src/third-party/"

      # C++ Formatting
      - name: Install Clang-format
        run: sudo apt-get install -y clang-format
      - name: Run Clang-format
        run: |
          find ./src \
            -path ./src/third-party -prune -o \
            \( -name "*.h" -o -name "*.hpp" -o -name "*.cpp" \) -print \
          | xargs clang-format --dry-run --Werror

      # C++ Linting
      - name: Install dependencies for C++ linting
        run: |
          sudo apt install software-properties-common
          sudo add-apt-repository universe
          sudo apt update && sudo apt install curl -y
          export ROS_APT_SOURCE_VERSION=$(curl -s https://api.github.com/repos/ros-infrastructure/ros-apt-source/releases/latest | grep -F "tag_name" | awk -F\" '{print $4}')
          curl -L -o /tmp/ros2-apt-source.deb "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_SOURCE_VERSION}/ros2-apt-source_${ROS_APT_SOURCE_VERSION}.$(. /etc/os-release && echo ${UBUNTU_CODENAME:-${VERSION_CODENAME}})_all.deb"
          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt update
          sudo apt-get install -y clang-tidy python3-rosdep ros-humble-ros-desktop ros-dev-tools python3-colcon-common-extensions ros-humble-ament-cmake
      - name: Test
        run: |
          pwd
          ls
      - name: Initialize rosdeps
        run: |
          sudo rosdep init
          rosdep update
          rosdep install --from-paths src -i -r -y
      - name: Build for compile_commands.json files
        run: |
          source /opt/ros/humble/setup.bash && echo "setup.bash has been sourced."
          colcon build --continue-on-error --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON --cmake-force-configure --parallel-workers $(nproc)


