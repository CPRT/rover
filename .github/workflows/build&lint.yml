name: Build & Lint

on:
  workflow_call:

jobs:
  build-lint:
    runs-on: [self-hosted]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & lint (amd64)
        id: build_lint_amd64
        run: |
          ./docker_build.sh --test
