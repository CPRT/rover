drive_teleop_node:
  ros__parameters:
    forward_axis: 1
    strafe_axis: 0
    yaw_axis: 2
    max_linear: 2.0
    max_angular: 1.0
    servo_y_axis: 7
    servo_x_axis: 6
    servo_home_button: 1
    servo_increment: 0.01
    servo_min: 0.0
    servo_max: 6.28
    default_servo_x: 3.10
    default_servo_y: 3.75

arm_teleop_node:
  ros__parameters:
    throttle:
      axis: 2
    joint_1_axis: 0
    joint_2_axis: 1
    joint_3_axis: 5
    joint_4_axis: 3
    wrist_yaw_positive: 3
    wrist_yaw_negative: 5
    joint_6_axis: 4
    dot_inc: 4

science_teleop_node:
  ros__parameters:
    drill_power_axis: 3
    drill_elevation_axis: 1
    servos:
      servo_count: 8
      servo0:
        pin: 27
        name: "strip_pump"
        button: 12
        duration: 2
        duty_cycle: 0.5
        frequency: 50
      servo1:
        pin: 26
        name: "resin_pump"
        button: 11
        duration: 2
        duty_cycle: 0.5
        frequency: 50
      servo2:
        pin: 25
        name: "benedict_pump"
        button: 1
        duration: 2
        duty_cycle: 0.5
        frequency: 50
      servo3:
        pin: 33
        name: "benedict_pump"
        button: 13
        duration: 2
        duty_cycle: 0.5
        frequency: 50
      servo4:
        pin: 21
        name: "sample_mixing_motor"
        button: 14
        duration: 2
        duty_cycle: 0.8
        frequency: 2000
      servo5:
        pin: 35
        name: "ion_exchange_servo"
        button: 15
        duration: 2
        duty_cycle: 0.5
        frequency: 2000
      servo6:
        pin: 29
        name: "polarimiter_servo"
        button: 2
        duration: 2
        duty_cycle: 0.0
        frequency: 50
      servo7:
        pin: 5
        name: "door_servo"
        button: 3
        duration: 3
        duty_cycle: 0.25
        frequency: 75
    sensors:
      sensor0:
        name: "polarimiter"
        pin: 14
        type: 0         # 0 for analog, 1 for dht
      sensor1:
        name: "methane"
        pin: 4
        type: 0
      sensor2:
        name: "CO2"
        pin: 12
        type: 0
      sensor3:
        name: "moisture_temperature"
        pin: 2
        type: 1

elevator:
  roboclaw_elevator_node:
    ros__parameters:
      port: "/dev/ttyACM0"
      baudrate: 115200

drill:
  roboclaw_drill_node:
    ros__parameters:
      port: "/dev/ttyACM1"
      baudrate: 115200