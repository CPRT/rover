drive_teleop_node:
  ros__parameters:
    forward_axis: 1
    strafe_axis: 0
    yaw_axis: 2
    max_linear: 2.0
    max_angular: 1.0
    servo_y_axis: 7
    servo_x_axis: 6
    gimbal_speed: 0.4  # rad/s; position limits and centers belong to ros2_control
    servo_home_button: 0
    mast_left_button: 3
    mast_right_button: 1
    cam_left_button: 6
    cam_right_button: 7

drill_teleop_node:
  ros__parameters:
    drill_power_axis: 2
    drill_elevation_axis: 1
    joy_first_message_timeout_s: 10.0
    max_drill_duty: 1.0
    max_elevator_duty: 1.0
    drill_cmd_topic: "/drill/set"
    elevator_cmd_topic: "/elevator/set"