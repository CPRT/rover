# This config file is used by ros2_control
/**:
  ros__parameters:
    update_rate: 100  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    chassis_controller:
      type: swerve_controller/SwerveController

arm_controller:
  ros__parameters:
    joints:
      - Joint_1
      - Joint_2
      - Joint_3
      - Joint_4
      - Joint_5
      - Joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity

chassis_controller:
  ros__parameters:
    use_stamped_cmds: false
    axles:
      front_left:
        steering_angle_name: Left_front_wheel_arm_joint
        wheel_velocity_name: Left_front_wheel_joint
      front_right:
        steering_angle_name: Right_front_wheel_arm_joint
        wheel_velocity_name: Right_front_wheel_joint
      rear_left:
        steering_angle_name: Left_back_wheel_arm_joint
        wheel_velocity_name: Left_back_wheel_joint
      rear_right:
        steering_angle_name: Right_back_wheel_arm_joint
        wheel_velocity_name: Right_back_wheel_joint
    wheel_base: 0.5
    track_width: 0.4
    wheel_radius: 0.1
    odom_publish_rate: 10.0
    cmd_timeout: 0.0
    min_angle: -1.6
    max_angle: 1.6