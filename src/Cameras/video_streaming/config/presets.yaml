preset_node:
  ros__parameters:
    presets:
    - "DrivePreset"
    - "EEFPreset"
    - "BellyPreset"
    - "MastPreset"
    - "DriveEEFPreset"
    - "EEFDrivePreset"
    - "EEFDriveMast"
    - "DriveMastPreset"
    DrivePreset:
      name: "Drive"
      sources:
      - "Drive"
      Drive:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    EEFPreset:
      name: "EEF"
      sources:
      - "EndEffector"
      EndEffector:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    BellyPreset:
      name: "Belly"
      sources:
      - "Belly"
      Belly:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    MastPreset:
      name: "Mast"
      sources:
      - "Mast"
      Mast:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    DriveEEFPreset:
      name: "Drive + EEF"
      sources:
      - "Drive"
      - "EndEffector"
      Drive:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
      EndEffector:
        width: 30
        height: 30
        origin_x: 70
        origin_y: 0
