#Types: 0 for v4l2, 1 for test source, Other types are not supported yet

input_node:
  ros__parameters:
    camera_name:
    - "Drive"
    - "EndEffector"
    - "Bottom"
    - "Mast"
    - "Test"
    Drive:
      path: "/dev/v4l/by-id/drive_camera"
      type: 0
      encoded: false
      height: 1200
      width: 1920
      framerate: 30
    EndEffector:
      path: "/dev/v4l/by-id/usb-MACROSILICON_USB_Video_20200909-video-index0"
      type: 0
      encoded: true
    Bottom:
      path: "/dev/v4l/by-id/usb-HD_Camera_Manufacturer_USB_2.0_Camera-video-index0"
      type: 0
      encoded: true
      height: 480
      width: 640
    Mast:
      path: "/dev/v4l/by-id/usb-Sonix_Technology_Co.__Ltd._Webcam_Webcam-video-index0"
      type: 0
      encoded: true
      height: 720
      width: 1280
    Test:
      type: 1
    presets:
    - "DrivePreset"
    - "EEFPreset"
    - "BellyPreset"
    - "DriveEEFPreset"
    - "EEFDrivePreset"
    DrivePreset:
      name: "Drive"
      sources:
      - "Drive"
      Drive:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    EEFPreset:
      name: "EEF"
      sources:
      - "EndEffector"
      EndEffector:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    BellyPreset:
      name: "Belly"
      sources:
      - "Belly"
      Belly:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
    DriveEEFPreset:
      name: "Drive + EEF"
      sources:
      - "Drive"
      - "EndEffector"
      Drive:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
      EndEffector:
        width: 30
        height: 30
        origin_x: 70
        origin_y: 0
    EEFDrivePreset:
      name: "EEF + Drive"
      sources:
      - "EndEffector"
      - "Drive"
      EndEffector:
        width: 100
        height: 100
        origin_x: 0
        origin_y: 0
      Drive:
        width: 30
        height: 30
        origin_x: 70
        origin_y: 0